<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BNI 챕터 안내</title>
<style>
  *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#f5f5f7;color:#222;line-height:1.6}
  .wrap{max-width:640px;margin:0 auto;padding:48px 20px}
  header{text-align:center;margin-bottom:32px}.badge{display:inline-block;background:#cf2030;color:#fff;font-weight:700;padding:4px 12px;border-radius:999px;font-size:14px;letter-spacing:1px}
  h1{font-size:26px;margin:16px 0 8px}p.sub{color:#666;margin:0}
  .card{display:block;background:#fff;border-radius:14px;padding:20px 22px;margin-bottom:14px;text-decoration:none;color:inherit;box-shadow:0 1px 4px rgba(0,0,0,.08);transition:transform .15s}
  .card:hover{transform:translateY(-2px)}.card h2{margin:0 0 4px;font-size:19px;color:#cf2030}.card p{margin:0;color:#555;font-size:15px}
  footer{text-align:center;color:#999;font-size:13px;margin-top:40px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="badge">BNI</span>
    <h1>BNI 챕터 안내</h1>
    <p class="sub">아래에서 챕터를 선택하세요.</p>
  </header>
  <main>
    <!-- 챕터 추가 시: 폴더(예: ./새챕터/index.html)를 만들고 아래에 카드 하나 추가 -->
    <a class="card" href="./pioneer/">
      <h2>파이오니어 챕터 (Pioneer)</h2>
      <p>부산 · BNI 파이오니어 챕터 페이지</p>
    </a>
  </main>
  <footer>bnich.bizmy.net</footer>
</div>
</body>
</html>
